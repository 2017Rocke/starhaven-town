name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ['3.9', '3.12']
        exclude:
          - os: macos-15
            python: '3.9'
          - os: windows-2022
            python: '3.9'
    runs-on: ${{ matrix.os }}
    env:
      PYTHON: python
      STARHAVEN_TEST_PYTHON: python
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/house-art.js
      - run: node --check web/scout-art.js
      - run: node --check web/scout-workspace.js
      - run: node --check web/forest-art.js
      - run: node --check web/scout-journey.js
      - run: node --check web/road-art.js
      - run: node --check web/road-navigation.js
      - run: node --check web/security-workspace.js
      - run: node tests/test_scout_journey.js
      - run: node tests/test_house_art.js
      - run: node tests/test_village_plaza.js
      - run: node tests/test_road_art.js
      - run: node tests/test_road_navigation.js
      - run: node tests/test_security_workspace.js
      - run: python scripts/export_source.py
