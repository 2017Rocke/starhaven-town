name: Build installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv python install 3.12
      - name: Test and build
        run: |
          uv run --python 3.12 --no-project python -m unittest discover -s tests -v
          runtime_root="$(uv run --python 3.12 --no-project python -c 'import sys; print(sys.base_prefix)')"
          uv run --python 3.12 --no-project python scripts/build_macos.py --python-runtime "$runtime_root"
          STARHAVEN_TEST_INSTALLER="build/macos-$(uname -m)/安装星栖小镇.app" uv run --python 3.12 --no-project python tests/test_installer_integration.py -v
          uv run --python 3.12 --no-project python scripts/export_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: starhaven-${{ matrix.runner }}
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - name: Test and build Windows x64 package
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          uv python install 3.12
          uv run --python 3.12 --no-project python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = uv run --python 3.12 --no-project python -c "import sys; print(sys.base_prefix)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Ensure host pip exists for --target installs into the runtime.
          uv run --python 3.12 --no-project python -m pip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --python 3.12 --no-project python scripts/build_windows.py --python-runtime $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --python 3.12 --no-project python scripts/export_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: starhaven-windows-x64
          path: dist/*
