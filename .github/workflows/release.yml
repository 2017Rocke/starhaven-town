name: Build macOS installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv python install 3.12
      - name: Test and build
        run: |
          uv run --python 3.12 --no-project python -m unittest discover -s tests -v
          runtime_root="$(uv run --python 3.12 --no-project python -c 'import sys; print(sys.base_prefix)')"
          uv run --python 3.12 --no-project python scripts/build_macos.py --python-runtime "$runtime_root"
          uv run --python 3.12 --no-project python scripts/export_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: starhaven-${{ matrix.runner }}
          path: dist/*
